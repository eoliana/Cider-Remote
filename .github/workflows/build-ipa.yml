name: Build unsigned IPA (Cider 4.x)

on:
  push:
    branches: [main, v4]
  workflow_dispatch:
    inputs:
      with_widget:
        description: 'Keep the Live Activity widget extension (needs the App Group entitlement)'
        type: boolean
        default: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "installed:"
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null \
            || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Resolve SwiftPM packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Cider Remote.xcodeproj" \
            -scheme "Cider Remote"

      # The app + widget share an App Group via entitlements. An unsigned build
      # cannot carry those, so compile with signing disabled and let the user's
      # own signing step / AltStore / SideStore apply entitlements at install.
      - name: Build unsigned (device, no signing)
        run: |
          set -o pipefail
          # Create build/ BEFORE tee: with `set -o pipefail`, tee failing to open
          # its log file (because derivedDataPath hasn't created the dir yet)
          # fails the step even though xcodebuild succeeded.
          mkdir -p build
          xcodebuild build \
            -project "Cider Remote.xcodeproj" \
            -scheme "Cider Remote" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            | tee build/xcodebuild.log

      - name: Assemble IPA
        env:
          # `inputs.with_widget` is EMPTY on a push event, and the
          # `&&/||` idiom still evaluated to 'false' there, so the strip ran
          # on every automatic build. Use an explicit shell default instead:
          # only a deliberate "false" drops the widget.
          WITH_WIDGET: ${{ inputs.with_widget }}
        run: |
          set -euo pipefail
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "app=$APP"
          # Default to keeping the widget; strip only on explicit false.
          KEEP_WIDGET="${WITH_WIDGET:-true}"
          echo "WITH_WIDGET='$WITH_WIDGET' -> KEEP_WIDGET=$KEEP_WIDGET"
          if [ "$KEEP_WIDGET" = "false" ]; then
            rm -rf "$APP/PlugIns"
            echo "widget extension removed (with_widget=false)"
          else
            echo "keeping widget extension: $(ls "$APP/PlugIns" 2>/dev/null)"
          fi
          mkdir -p build/Payload
          rm -rf build/Payload/*.app
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ../Cider-Remote-v4-unsigned.ipa Payload)
          ls -la Cider-Remote-v4-unsigned.ipa
          unzip -l Cider-Remote-v4-unsigned.ipa | head -20

      - name: Verify payload
        run: |
          set -euo pipefail
          unzip -o -q Cider-Remote-v4-unsigned.ipa -d verify
          BIN=$(find verify/Payload -maxdepth 1 -name '*.app' -type d)
          MAIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$BIN/Info.plist")
          echo "bundle=$BIN main=$MAIN"
          test -f "$BIN/$MAIN"

          # Gate: the Live Activity widget MUST be in the payload. Two earlier
          # builds shipped without it (a shell default that ate the extension)
          # and it fails silently on device, so assert it here.
          if ! find verify/Payload -maxdepth 3 -name '*.appex' | grep -q .; then
            echo "::error::no .appex in the IPA - Live Activity/widget would be missing"
            find verify/Payload -maxdepth 2 -type d | sed 's/^/  /'
            exit 1
          fi
          echo "appex: $(find verify/Payload -maxdepth 3 -name '*.appex')"
          # Cider-4 transport markers: literal strings that exist ONLY on the v4
          # branch. I derived this list with:
          #   comm -23 <v4 strings> <main strings>
          # so a hit here proves the v4 code compiled in, and a miss means
          # we silently shipped the old v2.x app.
          #
          # Every marker must be >= ~16 bytes. Swift stores literals of about
          # 16 bytes or fewer as instruction immediates rather than in
          # __cstring, so `strings` legitimately misses short ones
          # ("apptoken", "amapi/run-v3") even in a perfect build.
          MISSING=0
          for s in "playback/autoplay/toggle" "library/now-playing/rating" \
                   "playback/shuffle/toggle" "playback/repeat/toggle" \
                   "playback/toggle-autoplay" "playback/add-later" ; do
            N=$(strings -a "$BIN/$MAIN" | grep -c -- "$s" || true)
            printf '%-30s %s\n' "$s" "$N"
            [ "$N" -gt 0 ] || MISSING=1
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::v4 transport markers missing from the built binary"
            exit 1
          fi
          echo "--- legacy v1 endpoints still compiled in (expected >0: the"
          echo "--- useV2 ternaries keep both branches, so their presence"
          echo "--- proves nothing about version) ---"
          for s in "playback/play-item-href" "playback/queue/clear-queue" "playback/play-later" ; do
            printf '%-30s %s\n' "$s" "$(strings -a "$BIN/$MAIN" | grep -c -- "$s" || true)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cider-Remote-v4-unsigned-ipa
          path: Cider-Remote-v4-unsigned.ipa
          if-no-files-found: error